name: ProxmoxManager
options:
  bundleIdPrefix: com.aszer0s
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    SWIFT_VERSION: "5.0"

targets:
  ProxmoxManager:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ProxmoxManager
    info:
      path: ProxmoxManager/Info.plist
      properties:
        CFBundleDisplayName: Proxmox Manager
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        NSLocalNetworkUsageDescription: "Proxmox Manager connects directly to Proxmox servers on your local network."
        NSFaceIDUsageDescription: "Use Face ID to protect access to your saved Proxmox servers."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aszer0s.proxmoxmanager
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  ProxmoxManagerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ProxmoxManagerTests
    dependencies:
      - target: ProxmoxManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aszer0s.proxmoxmanager.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ProxmoxManager.app/ProxmoxManager"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  ProxmoxManager:
    build:
      targets:
        ProxmoxManager: all
        ProxmoxManagerTests: [test]
    test:
      targets:
        - name: ProxmoxManagerTests
