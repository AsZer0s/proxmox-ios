<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <link rel="stylesheet" href="./xterm.css">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101114; }
    #terminal { width: 100%; height: calc(100% - 48px); }
    .xterm { padding: 6px; box-sizing: border-box; }
    #toolbar { height: 48px; display: flex; align-items: center; gap: 7px; padding: 5px 8px; box-sizing: border-box; overflow-x: auto; background: #202126; }
    #toolbar button { flex: none; height: 36px; border: 0; border-radius: 9px; padding: 0 12px; color: white; background: #3a3b42; }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <div id="toolbar"><button id="escape" data-input="\u001b">Esc</button><button id="tab" data-input="\t">Tab</button><button id="ctrlC" data-input="\u0003">Ctrl C</button><button id="ctrlZ" data-input="\u001a">Ctrl Z</button><button id="ctrlL" data-input="\u000c">Ctrl L</button><button id="paste">Paste</button></div>
  <script type="module">
    import { Terminal } from "./xterm.mjs";
    import { FitAddon } from "./addon-fit.mjs";

    const terminal = new Terminal({
      cursorBlink: true,
      convertEol: true,
      fontFamily: "ui-monospace, Menlo, Monaco, monospace",
      fontSize: 13,
      theme: { background: "#101114", foreground: "#f2f2f2", cursor: "#58a6ff" }
    });
    const fitAddon = new FitAddon();
    terminal.loadAddon(fitAddon);
    terminal.open(document.getElementById("terminal"));
    fitAddon.fit();

    terminal.onData(data => window.webkit.messageHandlers.consoleSocket.postMessage({
      action: "terminalInput",
      data: data
    }));
    document.querySelectorAll("button[data-input]").forEach(button => button.addEventListener("click", () =>
      window.webkit.messageHandlers.consoleSocket.postMessage({ action: "terminalInput", data: button.dataset.input })));
    document.getElementById("paste").addEventListener("click", () =>
      window.webkit.messageHandlers.consoleSocket.postMessage({ action: "requestPaste" }));
    window.nativePaste = function(text) {
      window.webkit.messageHandlers.consoleSocket.postMessage({ action: "terminalInput", data: text });
    };
    window.localizeConsole = function(labels) {
      document.getElementById("paste").textContent = labels.paste;
      document.getElementById("escape").textContent = labels.escape;
      document.getElementById("tab").textContent = labels.tab;
      document.getElementById("ctrlC").textContent = labels.ctrlC;
      document.getElementById("ctrlZ").textContent = labels.ctrlZ;
      document.getElementById("ctrlL").textContent = labels.ctrlL;
    };

    function resize() {
      fitAddon.fit();
      window.webkit.messageHandlers.consoleSocket.postMessage({
        action: "resize",
        columns: terminal.cols,
        rows: terminal.rows
      });
    }
    new ResizeObserver(resize).observe(document.getElementById("terminal"));

    window.nativeSocketReceive = function(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index++) bytes[index] = binary.charCodeAt(index);
      terminal.write(bytes);
    };
    window.nativeSocketOpened = function() {
      terminal.focus();
      resize();
    };
    window.nativeSocketClosed = function() {
      terminal.write("\r\n\x1b[90m[Session closed]\x1b[0m\r\n");
    };
    window.nativeSocketError = function(message) {
      terminal.write("\r\n\x1b[31m" + message + "\x1b[0m\r\n");
    };

    window.webkit.messageHandlers.consoleSocket.postMessage({ action: "pageReady" });
    setInterval(() => window.webkit.messageHandlers.consoleSocket.postMessage({ action: "ping" }), 30000);
  </script>
</body>
</html>
