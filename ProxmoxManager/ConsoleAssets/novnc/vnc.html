<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <style>
    html, body, #screen { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101114; }
    #screen canvas { margin: auto; }
    #consoleToolbar { position: fixed; left: 10px; right: 10px; bottom: 10px; z-index: 2; display: flex; gap: 7px; justify-content: flex-end; pointer-events: none; }
    #consoleToolbar button { pointer-events: auto; min-width: 42px; height: 38px; padding: 0 10px; border: 0; border-radius: 10px; color: white; background: rgba(50, 50, 55, .88); font-size: 14px; }
    #keyboardButton { font-size: 21px !important; }
    #keyboardInput { position: fixed; left: -100px; bottom: 0; width: 1px; height: 1px; opacity: 0; }
  </style>
</head>
<body>
  <div id="screen"></div>
  <div id="consoleToolbar">
    <button id="pasteButton" type="button">Paste</button>
    <button id="escButton" type="button">Esc</button>
    <button id="tabButton" type="button">Tab</button>
    <button id="cadButton" type="button">Ctrl Alt Del</button>
    <button id="keyboardButton" type="button">⌨︎</button>
  </div>
  <textarea id="keyboardInput" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
  <script>
    let nativeSocket = null;
    const pendingMessages = [];
    let activeRFB = null;

    class NativeWebSocket {
      static CONNECTING = 0;
      static OPEN = 1;
      static CLOSING = 2;
      static CLOSED = 3;

      constructor() {
        this.binaryType = "arraybuffer";
        this.protocol = "binary";
        this.readyState = NativeWebSocket.CONNECTING;
        this.onopen = null;
        this.onmessage = null;
        this.onclose = null;
        this.onerror = null;
        nativeSocket = this;
        queueMicrotask(() => window.webkit.messageHandlers.consoleSocket.postMessage({ action: "socketCreated" }));
      }

      send(value) {
        const bytes = value instanceof ArrayBuffer
          ? new Uint8Array(value)
          : new Uint8Array(value.buffer, value.byteOffset, value.byteLength);
        let binary = "";
        for (let offset = 0; offset < bytes.length; offset += 0x8000) {
          binary += String.fromCharCode(...bytes.subarray(offset, offset + 0x8000));
        }
        window.webkit.messageHandlers.consoleSocket.postMessage({
          action: "sendBinary",
          data: btoa(binary)
        });
      }

      close() {
        this.readyState = NativeWebSocket.CLOSING;
        window.webkit.messageHandlers.consoleSocket.postMessage({ action: "close" });
        this.readyState = NativeWebSocket.CLOSED;
        this.onclose?.({ code: 1000, reason: "" });
      }
    }

    window.WebSocket = NativeWebSocket;

    window.startVNC = async function(password, keyboardLabel) {
      try {
        const { default: RFB } = await import("./core/rfb.js");
        const rfb = new RFB(document.getElementById("screen"), "native://console", {
          credentials: { password: password }
        });
        activeRFB = rfb;
        rfb.scaleViewport = true;
        rfb.resizeSession = true;
        rfb.focusOnClick = true;
        rfb.addEventListener("credentialsrequired", () => rfb.sendCredentials({ password: password }));

        const keyboardButton = document.getElementById("keyboardButton");
        const keyboardInput = document.getElementById("keyboardInput");
        keyboardButton.title = keyboardLabel;
        keyboardButton.setAttribute("aria-label", keyboardLabel);
        const resetInput = () => {
          keyboardInput.value = " ";
          keyboardInput.setSelectionRange(1, 1);
        };
        const sendKeysym = keysym => {
          rfb.sendKey(keysym, null, true);
          rfb.sendKey(keysym, null, false);
        };
        document.getElementById("pasteButton").addEventListener("click", () =>
          window.webkit.messageHandlers.consoleSocket.postMessage({ action: "requestPaste" }));
        document.getElementById("escButton").addEventListener("click", () => sendKeysym(0xff1b));
        document.getElementById("tabButton").addEventListener("click", () => sendKeysym(0xff09));
        document.getElementById("cadButton").addEventListener("click", () => rfb.sendCtrlAltDel());
        rfb.addEventListener("clipboard", event => window.webkit.messageHandlers.consoleSocket.postMessage({
          action: "setClipboard", data: event.detail.text || ""
        }));
        keyboardButton.addEventListener("click", () => {
          resetInput();
          keyboardInput.focus();
        });
        keyboardInput.addEventListener("beforeinput", event => {
          if (event.inputType === "deleteContentBackward") {
            event.preventDefault();
            sendKeysym(0xff08);
            resetInput();
          }
        });
        keyboardInput.addEventListener("input", event => {
          for (const character of event.data || "") {
            const codepoint = character.codePointAt(0);
            sendKeysym(codepoint <= 0xff ? codepoint : (0x01000000 | codepoint));
          }
          resetInput();
        });
        keyboardInput.addEventListener("keydown", event => {
          const keys = {
            Enter: 0xff0d, Tab: 0xff09, Escape: 0xff1b,
            ArrowLeft: 0xff51, ArrowUp: 0xff52, ArrowRight: 0xff53, ArrowDown: 0xff54
          };
          if (keys[event.key]) {
            event.preventDefault();
            sendKeysym(keys[event.key]);
            resetInput();
          }
        });
      } catch (error) {
        window.webkit.messageHandlers.consoleSocket.postMessage({
          action: "clientError",
          message: String(error)
        });
      }
    };

    window.nativePaste = function(text) {
      activeRFB?.clipboardPasteFrom(text);
    };
    window.localizeConsole = function(labels) {
      document.getElementById("pasteButton").textContent = labels.paste;
      document.getElementById("escButton").textContent = labels.escape;
      document.getElementById("tabButton").textContent = labels.tab;
      document.getElementById("cadButton").textContent = labels.ctrlAltDelete;
    };

    window.nativeSocketOpened = function() {
      if (!nativeSocket) return;
      nativeSocket.readyState = NativeWebSocket.OPEN;
      nativeSocket.onopen?.({});
      while (pendingMessages.length > 0) deliver(pendingMessages.shift());
    };

    function deliver(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index++) bytes[index] = binary.charCodeAt(index);
      nativeSocket.onmessage?.({ data: bytes.buffer });
    }

    window.nativeSocketReceive = function(base64) {
      if (!nativeSocket || nativeSocket.readyState !== NativeWebSocket.OPEN) {
        pendingMessages.push(base64);
        return;
      }
      deliver(base64);
    };

    window.nativeSocketClosed = function() {
      if (!nativeSocket) return;
      nativeSocket.readyState = NativeWebSocket.CLOSED;
      nativeSocket.onclose?.({ code: 1000, reason: "" });
    };

    window.nativeSocketError = function(message) {
      nativeSocket?.onerror?.({ message: message });
    };
  </script>
</body>
</html>
